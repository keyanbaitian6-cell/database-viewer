<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/database-viewer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="databaseのバックアップを読み込んで見る、閲覧専用のページ">
  <!-- 検索に載せない（記録はページに含まれないが、URLを広めないため）。 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS: ホーム画面に追加するとアプリのように開く -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="database">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png?v=panda-20260930">
  <link rel="icon" type="image/png" href="favicon.png?v=panda-20260930"/>

  <title>database 閲覧</title>
  <link rel="manifest" href="manifest.json?v=panda-20260930">
  <!-- ダブルタップでの拡大を止める（ボタンを連打すると拡大されるため、2026-10-22 利用者）。2本指で広げる拡大はそのまま。 -->
  <style>body { background: #f5f5f7; margin: 0; } html, body { touch-action: manipulation; }</style>
</head>
<body>
  <script>
  // バックアップ（database-backup 形式のJSON）を、この端末の中だけで読む。
  // どこにも送らない。1行に1台の形は1行ずつ読み、グラフの画像は読み飛ばす
  // （iPhoneのメモリと保存領域を使いすぎないため）。グラフの線（曲線）は
  // 画像の6分の1ほどと軽いので残し、画面で線を描く。
  // 読んだ結果は IndexedDB に覚え、次からは選び直さなくても開ける。
  window.databaseViewer = (() => {
    const DB = 'database-viewer';
    const STORE = 'kv';
    // Driveの自動読み込みで、この時間なにも届かなければ打ち切る（電波が弱いとき
    // に「読み込み中」のまま待ち続けないように）。届いている間は待つ。
    const REMOTE_IDLE_MS = 90000;
    // Googleのスクリプトの中継先は、ときどき返事が固まり、30〜90秒たってから404を返す
    // （2026-10-04の実測で8回中4回）。返事が来ないときは8秒ごとに同じリクエストをもう1本出し、
    // 先に成功した方を使う。404・429・5xx・通信失敗も、少し待って次を出す（最大4本）。
    // 部品は drive_fetch.mjs（P’s CUBEの閲覧ページと共通）。

    function lighten(record) {
      const graph = record && record.graph_measurement;
      if (graph && typeof graph === 'object') {
        delete graph.preview_image;
        delete graph.preview_stored;
        delete graph.curve_stored;
      }
      return record;
    }

    // [known] は表示中の内容の書き出し時刻。先頭の行の exported_at が同じなら、
    // 中身も同じなので、そこで読むのをやめて { unchanged: true } を返す。
    async function parse(stream, known) {
      const notBackup = (format) => new Error(format === 'pscube-viewer'
        ? 'P’s CUBEのファイルです。P’s CUBEのページ（https://keyanbaitian6-cell.github.io/database-viewer/pscube/）の「ファイルを読み込む」で読み込んでください。'
        : 'databaseのバックアップファイルではありません。');
      const validate = doc => {
        if (doc && typeof doc.error === 'string') throw new Error(doc.error);
        if (!doc || doc.format !== 'database-backup' || !Array.isArray(doc.records)) throw notBackup(doc?.format);
        if (doc.version !== 1) throw new Error('対応していないバックアップのバージョンです。');
        for (const name of ['candidate_snapshots', 'date_events']) {
          if (name in doc && !Array.isArray(doc[name])) throw new Error(name + ' の形式が不正です。');
        }
      };
      const parser = window.databaseBackupStream || await import('./backup_stream.mjs');
      const result = await parser.readBackupJson(stream, {known, validate, record: lighten});
      const doc = result.document;
      if (result.unchanged) return {unchanged: true, header: doc};
      const {records, candidate_snapshots, ...header} = doc;
      return {header, records, candidates: candidate_snapshots || [], date_events: doc.date_events || [],
        ...(Array.isArray(doc.history_days) ? {history_days: doc.history_days} : {})};
    }

    function finish(result, name) {
      result.file = name;
      result.loaded_at = new Date().toISOString();
      return JSON.stringify(result);
    }

    function open() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    const pscubeModule = () => import('./pscube/viewer_bridge.mjs');
    const pscubeBridge = async () => (await pscubeModule()).createPscubeBridge();
    let pickedEvents = null;
    async function readStored() {
      const db = await open();
      try {
        return await new Promise((resolve, reject) => {
          const request = db.transaction(STORE).objectStore(STORE).get('data');
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
      } finally { db.close(); }
    }
    async function readEventMetadata() {
      if (await pscubeActive()) return null;
      let text = await readStored();
      if (!text) return null;
      const stream = new Blob([text]).stream();
      text = null;
      const parser = window.databaseBackupStream || await import('./backup_stream.mjs');
      const {document: doc} = await parser.readBackupJson(stream, {skipRecordValues: true});
      return JSON.stringify({records: [], date_events: doc.date_events || []});
    }
    async function pscubeActive() {
      if (typeof indexedDB === 'undefined') return false;
      const db = await open();
      try {
        return await new Promise((resolve, reject) => {
          const request = db.transaction(STORE).objectStore(STORE).get('active_source');
          request.onsuccess = () => resolve(request.result === 'pscube');
          request.onerror = () => reject(request.error);
        });
      } finally { db.close(); }
    }

    return {
      // ファイルを選んで読む。選ばなければ null。
      pick() {
        pickedEvents = null;
        return new Promise((resolve, reject) => {
          const input = document.createElement('input');
          input.type = 'file';
          // 種類で絞り込まない。iPhoneの「ファイル」では、Googleドライブ上の
          // JSONが種類不明と扱われ、絞り込むと灰色になって選べないことがある。
          // 中身が違えば読み込みのときに知らせる。
          input.onchange = async () => {
            const file = input.files && input.files[0];
            if (!file) { resolve(null); return; }
            try {
              const head = await file.slice(0, 4096).text();
              if (/\.webarchive$/i.test(file.name) || head.startsWith('bplist') || head.includes('WebMainResource') || /"format"\s*:\s*"pscube-viewer"/.test(head) || (/"rack"\s*:/.test(head) && /"graph"\s*:/.test(head))) {
                resolve(await (await pscubeModule()).readPscubeFiles([file]));
              } else {
                const result = await parse(file.stream());
                // 別タブで入力した直後のイベントも拾う。古い台のオブジェクトは作らない。
                try { pickedEvents = await readEventMetadata(); } catch { /* 表示中の入力を引き継ぐ。 */ }
                resolve(finish(result, file.name));
              }
            }
            catch (error) { reject(error); }
          };
          input.oncancel = () => resolve(null);
          input.click();
        });
      },
      pickedEvents() { return pickedEvents; },
      // 同じサイトの中のファイルだけ（手元での確認用）。外部のURLは読まない。
      async fromUrl(url) {
        if (!url || /^[a-z]+:/i.test(url) || url.startsWith('//')) return null;
        const response = await fetch(url);
        if (!response.ok) return null;
        return finish(await parse(response.body), url);
      },
      // Googleのスクリプト（…/exec）から、Googleドライブの最新を読む。
      // それ以外のURLは読まない。記録はこの端末にだけ届く。
      // ファイルの書き出し時刻が [known]（表示中の内容の時刻）と同じなら、先頭の
      // 1行だけで読むのをやめて null を返す。開くたびに同じ中身を丸ごと読み直すと、
      // 通信と計算で電池を使うため。
      async fromRemote(url, known) {
        if (await pscubeActive()) return (await pscubeBridge()).fromRemote(url, known);
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url || '')) {
          throw new Error('GoogleのスクリプトのURL（https://script.google.com/macros/s/…/exec）を入れてください。');
        }
        // window.databaseDriveFetch は試験用の差し込み口（隔離環境では import() が使えない）。
        const { hedgedFetch, checkVersion, versionStore, isUnchanged } =
          (typeof window !== 'undefined' && window.databaseDriveFetch) || await import('./drive_fetch.mjs');
        const versions = versionStore('meruhen');
        const abort = new AbortController();
        let timer = 0;
        const wait = () => {
          clearTimeout(timer);
          timer = setTimeout(() => abort.abort(), REMOTE_IDLE_MS);
        };
        // 画面を離れている間（iPhoneでほかのアプリに切り替えた等）は待ち時間を数えない。
        // iPhoneは裏に回ったページの通信を止めるので、戻った瞬間に打ち切らないようにする。
        const page = typeof document === 'undefined' ? null : document;
        const onVisibility = () => {
          if (page.visibilityState === 'hidden') clearTimeout(timer);
          else wait();
        };
        if (page) page.addEventListener('visibilitychange', onVisibility);
        wait();
        // リクエストを出すたびに、無応答の時間を数え直す。
        const options = {
          fetchImpl: (...args) => fetch(...args),
          signal: abort.signal,
          onLaunch: (index) => { if (index > 0) wait(); },
        };
        const httpError = (status) => new Error('Googleドライブから読めませんでした（' + status + '）。');
        try {
          let full;
          let version = null;
          try {
            // 先に更新の目印だけを確かめる（新しいApps Scriptのとき数行の返事）。前に読んだときと
            // 同じなら、ファイルは読まない。古いスクリプトは全文を返すので、そのまま使う。
            const checked = await checkVersion(url + '?check=1', options);
            version = checked.version ?? null;
            if (isUnchanged(versions.get(), version, known || null)) return null;
            if (checked.parts && globalThis.crypto?.subtle) {
              const {fetchViewerParts, rememberViewerHistory} = await import('./viewer_parts.mjs');
              const saved = await window.databaseViewer.load();
              if (saved) await rememberViewerHistory(url, 'meruhen', JSON.parse(saved));
              const doc = await fetchViewerParts(url, 'meruhen', checked.parts, async request => {
                wait(); const response = await hedgedFetch(request, options);
                if (!response.ok) throw Object.assign(new Error('http'), {status: response.status});
                return response.json();
              });
              const response = new Response(JSON.stringify(doc), {headers: {'content-type': 'application/json'}});
              full = {response, stream: response.body};
            } else if (checked.stream) full = { response: checked.response, stream: checked.stream };
            else if (!checked.response.ok) throw Object.assign(new Error('http'), { status: checked.response.status });
            else {
              const response = await hedgedFetch(url, options);
              if (!response.ok) throw Object.assign(new Error('http'), { status: response.status });
              full = { response, stream: response.body };
            }
          } catch (error) {
            if (abort.signal.aborted || error?.name === 'AbortError') throw error;
            if (error && error.status) throw httpError(error.status);
            throw error && error.network ? error.network : error;
          }
          if ((full.response.headers.get('content-type') || '').includes('text/html')) {
            throw new Error('スクリプトの公開設定を確認してください（アクセスできるユーザー：全員）。');
          }
          wait();
          // 届くたびに待ち時間を数え直す。
          const body = full.stream.pipeThrough(new TransformStream({
            transform(chunk, controller) {
              wait();
              controller.enqueue(chunk);
            },
          }));
          const result = await parse(body, known || null);
          // 目印は、中身を読み終えて正しいと分かってから覚える。
          if (result.unchanged) {
            if (version) versions.set({ version, exported_at: known });
            return null;
          }
          if (version) versions.set({ version, exported_at: (result.header && result.header.exported_at) || null });
          return finish(result, 'Googleドライブ（自動）');
        } catch (error) {
          if (abort.signal.aborted) {
            throw new Error('Googleドライブから' + REMOTE_IDLE_MS / 1000 + '秒間応答がなかったため、読み込みをやめました。');
          }
          throw error;
        } finally {
          clearTimeout(timer);
          if (page) page.removeEventListener('visibilitychange', onVisibility);
        }
      },
      // 台の画面を開いたときに、その日のグラフの線だけを読む（2026-10-25）。[通し番号, 線] の一覧のJSON。
      async curves(url, refsText) {
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url || '')) {
          throw new Error('Googleドライブの自動読み込みが設定されていません。');
        }
        const { hedgedFetch } = (typeof window !== 'undefined' && window.databaseDriveFetch) || await import('./drive_fetch.mjs');
        const { fetchViewerCurves } = await import('./viewer_parts.mjs');
        const rows = await fetchViewerCurves(url, 'meruhen', JSON.parse(refsText), async request => {
          const response = await hedgedFetch(request, { fetchImpl: (...args) => fetch(...args) });
          if (!response.ok) throw new Error('Googleドライブから読めませんでした（' + response.status + '）。');
          return response.json();
        });
        return JSON.stringify(rows);
      },
      getRemote() {
        try { return localStorage.getItem('database-viewer-remote'); } catch (_) { return null; }
      },
      setRemote(url) {
        try {
          if (url) localStorage.setItem('database-viewer-remote', url);
          else localStorage.removeItem('database-viewer-remote');
        } catch (_) {}
      },
      async save(text, meruhen = false) {
        // Dartで検査・組み立て済みのメルヘンJSONは、保存のために全文を解析し直さない。
        const pscube = !meruhen && JSON.parse(text).format === 'pscube-viewer';
        if (pscube) await (await pscubeBridge()).save(text);
        const db = await open();
        try {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            if (!pscube) tx.objectStore(STORE).put(text, 'data');
            tx.objectStore(STORE).put(pscube ? 'pscube' : 'meruhen', 'active_source');
            tx.oncomplete = resolve;
            tx.onerror = tx.onabort = () => reject(tx.error || new Error('端末に保存できませんでした。'));
          });
        } finally { db.close(); }
      },
      async load() {
        if (await pscubeActive()) return (await pscubeBridge()).load();
        return readStored();
      },
      // 🌈の印（RAINBOW.md「iPhoneから付ける」）は本体（'data'、数十MB）と別の 'rainbow_marks' に置く。
      // 付け外し・共有の取り込みのたびに本体をまるごと読み書きすると、iPhoneのメモリが足りず落ちた
      // （2026-10-29）。本体に前から入っている印も使う（Dart側で合わせる）。
      async loadMarks() {
        const db = await open();
        try {
          return await new Promise((resolve, reject) => {
            const request = db.transaction(STORE).objectStore(STORE).get('rainbow_marks');
            request.onsuccess = () => resolve(request.result ?? null);
            request.onerror = () => reject(request.error);
          });
        } finally { db.close(); }
      },
      async saveMarks(text) {
        const db = await open();
        try {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(text, 'rainbow_marks');
            tx.oncomplete = resolve;
            tx.onerror = tx.onabort = () => reject(tx.error || new Error('端末に保存できませんでした。'));
          });
        } finally { db.close(); }
      },
      async exportBackup() { return (await pscubeBridge()).exportBackup(); },
      // 共有カレンダー（EVENT_CALENDAR.md、2026-10-08）：共有ファイルを読む・イベントを送る（web/shared_events.mjs）。
      async fetchShared(url, file) { return (await import('./shared_events.mjs')).fetchShared(url, file); },
      async postShared(url, text) { return (await import('./shared_events.mjs')).postShared(url, text); },
      async pscubeEvents() { return (await pscubeBridge()).timedEvents(); },
      async mergePscubeShared(text) { return (await pscubeBridge()).mergeShared(text); },
      // 文字をファイルとして保存する（メルヘンのイベントの書き出し、EVENT_CALENDAR.md）。
      download(name, text) {
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      },
      async importGraph(text) { return (await pscubeBridge()).importGraph(text); },
      async setDateEvent(scope, day, name) {
        return (await pscubeBridge()).setDateEvent(scope, day, name);
      },
      async setDateEventDays(scope, days, name) {
        return (await pscubeBridge()).setDateEventDays(scope, days, name);
      },
      async setPscubeType(scope, machine, type) {
        return (await pscubeBridge()).setPscubeType(scope, machine, type);
      },
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
