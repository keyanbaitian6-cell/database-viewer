<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="/database-viewer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="databaseのバックアップを読み込んで見る、閲覧専用のページ">
  <!-- 検索に載せない（記録はページに含まれないが、URLを広めないため）。 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS: ホーム画面に追加するとアプリのように開く -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="database">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png?v=panda-20260930">
  <link rel="icon" type="image/png" href="favicon.png?v=panda-20260930"/>

  <title>database 閲覧</title>
  <link rel="manifest" href="manifest.json?v=panda-20260930">
  <style>body { background: #f5f5f7; margin: 0; }</style>
</head>
<body>
  <script>
  // バックアップ（database-backup 形式のJSON）を、この端末の中だけで読む。
  // どこにも送らない。1行に1台の形は1行ずつ読み、グラフの画像は読み飛ばす
  // （iPhoneのメモリと保存領域を使いすぎないため）。グラフの線（曲線）は
  // 画像の6分の1ほどと軽いので残し、画面で線を描く。
  // 読んだ結果は IndexedDB に覚え、次からは選び直さなくても開ける。
  window.databaseViewer = (() => {
    const DB = 'database-viewer';
    const STORE = 'kv';
    // Driveの自動読み込みで、この時間なにも届かなければ打ち切る（電波が弱いとき
    // に「読み込み中」のまま待ち続けないように）。届いている間は待つ。
    const REMOTE_IDLE_MS = 90000;
    // Googleのスクリプトの中継先は、ときどき404を返す（2026-10-01の実測で12回中2回、
    // 間隔に関係なく起きた）。404・429・5xx・通信失敗は、少し待って2回までやり直す。
    const REMOTE_RETRY_DELAYS_MS = [1500, 3000];

    function lighten(record) {
      const graph = record && record.graph_measurement;
      if (graph && typeof graph === 'object') {
        delete graph.preview_image;
        delete graph.preview_stored;
        delete graph.curve_stored;
      }
      return record;
    }

    // [known] は表示中の内容の書き出し時刻。先頭の行の exported_at が同じなら、
    // 中身も同じなので、そこで読むのをやめて { unchanged: true } を返す。
    async function parse(stream, known) {
      const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
      let unchanged = false;
      const records = [];
      const candidates = [];
      let header = null;
      let section = 'header';
      let buffer = '';
      let whole = null; // 1行に1台の形でないとき、全文をためる
      let streamedCandidates = false;
      // 画像を保持せず外枠のJSONも検査する。各台の値だけをnullへ置き換える。
      const structure = [];
      const recordsStart = /"records"\s*:\s*\[$/;

      // P’s CUBEのファイル（pscube-viewer）は別のページで読む。ここで読むと何も入らないので案内する。
      const notBackup = (format) => new Error(format === 'pscube-viewer'
        ? 'P’s CUBEのファイルです。P’s CUBEのページ（https://keyanbaitian6-cell.github.io/database-viewer/pscube/）の「ファイルを読み込む」で読み込んでください。'
        : 'databaseのバックアップファイルではありません。');

      const validate = (doc) => {
        if (doc && typeof doc.error === 'string') throw new Error(doc.error);
        if (!doc || doc.format !== 'database-backup' || !Array.isArray(doc.records)) {
          throw notBackup(doc && doc.format);
        }
        if (doc.version !== 1) {
          throw new Error('対応していないバックアップのバージョンです。');
        }
        for (const key of ['candidate_snapshots', 'date_events']) {
          if (key in doc && !Array.isArray(doc[key])) {
            throw new Error(key + ' の形式が不正です。');
          }
        }
      };

      const handle = (raw) => {
        const text = raw.trim();
        if (!text) return;
        if (section === 'header') {
          const match = recordsStart.exec(text);
          if (!text.startsWith('{') || !match) {
            whole = [raw];
            section = 'whole';
            return;
          }
          let head = text.slice(0, match.index).trimEnd();
          if (head.endsWith(',')) head = head.slice(0, -1);
          header = JSON.parse(head + '}');
          validate({ ...header, records: [] });
          if (known && header.exported_at === known) {
            unchanged = true;
            return;
          }
          structure.push(text);
          section = 'records';
          return;
        }
        if (section === 'done') {
          structure.push(text);
          return;
        }
        if (text.startsWith(']')) {
          structure.push(text);
          section = section === 'records' && text.includes('"candidate_snapshots"') &&
              text.endsWith('[') ? 'candidates' : 'done';
          if (section === 'candidates') streamedCandidates = true;
          return;
        }
        const item = JSON.parse(text.endsWith(',') ? text.slice(0, -1) : text);
        structure.push(text.endsWith(',') ? 'null,' : 'null');
        if (section === 'records') records.push(lighten(item));
        else candidates.push(item);
      };

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (section === 'whole') { whole.push(value); continue; }
          buffer += value;
          let index;
          while (section !== 'whole' && !unchanged && (index = buffer.indexOf('\n')) >= 0) {
            handle(buffer.slice(0, index));
            buffer = buffer.slice(index + 1);
          }
          if (unchanged) break;
          if (section === 'whole') { whole.push(buffer); buffer = ''; }
          // 見出し行が来ないまま長くなったら、1行だけの以前の形とみなす。
          if (section === 'header' && buffer.length > 1000000) {
            whole = [buffer]; buffer = ''; section = 'whole';
          }
        }
        if (unchanged) {
          // 残りは読まない（通信もここで止まる）。
          try { await reader.cancel(); } catch (_) {}
          return { unchanged: true, header };
        }
        // 改行で終わらない短いJSONも、全文形式へ切り替えてから処理する。
        if (section !== 'whole') {
          handle(buffer);
          buffer = '';
        }
      } catch (error) {
        try { await reader.cancel(); } catch (_) {}
        throw error;
      } finally {
        reader.releaseLock();
      }
      if (section === 'whole') {
        whole.push(buffer);
        const doc = JSON.parse(whole.join(''));
        validate(doc);
        if (known && doc.exported_at === known) {
          return { unchanged: true, header: { format: doc.format, exported_at: doc.exported_at } };
        }
        return {
          header: { format: doc.format, exported_at: doc.exported_at, source: doc.source },
          records: doc.records.map(lighten),
          candidates: Array.isArray(doc.candidate_snapshots) ? doc.candidate_snapshots : [],
          date_events: Array.isArray(doc.date_events) ? doc.date_events : [],
        };
      }
      // EOFだけでは成功にしない。閉じ括弧、カンマ、余分な末尾文字も検査する。
      const envelope = JSON.parse(structure.join('\n'));
      validate(envelope);
      if (envelope.records.length !== records.length || envelope.records.some(item => item !== null)) {
        throw new Error('records が重複しているか、形式が不正です。');
      }
      if (streamedCandidates) {
        if (envelope.candidate_snapshots.length !== candidates.length ||
            envelope.candidate_snapshots.some(item => item !== null)) {
          throw new Error('candidate_snapshots が重複しているか、形式が不正です。');
        }
      } else if (Array.isArray(envelope.candidate_snapshots)) {
        for (const item of envelope.candidate_snapshots) candidates.push(item);
      }
      return { header, records, candidates, date_events: envelope.date_events || [] };
    }

    function finish(result, name) {
      result.file = name;
      result.loaded_at = new Date().toISOString();
      return JSON.stringify(result);
    }

    function open() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    const pscubeModule = () => import('./pscube/viewer_bridge.mjs');
    const pscubeBridge = async () => (await pscubeModule()).createPscubeBridge();
    async function pscubeActive() {
      if (typeof indexedDB === 'undefined') return false;
      const db = await open();
      try {
        return await new Promise((resolve, reject) => {
          const request = db.transaction(STORE).objectStore(STORE).get('active_source');
          request.onsuccess = () => resolve(request.result === 'pscube');
          request.onerror = () => reject(request.error);
        });
      } finally { db.close(); }
    }

    return {
      // ファイルを選んで読む。選ばなければ null。
      pick() {
        return new Promise((resolve, reject) => {
          const input = document.createElement('input');
          input.type = 'file';
          // 種類で絞り込まない。iPhoneの「ファイル」では、Googleドライブ上の
          // JSONが種類不明と扱われ、絞り込むと灰色になって選べないことがある。
          // 中身が違えば読み込みのときに知らせる。
          input.onchange = async () => {
            const file = input.files && input.files[0];
            if (!file) { resolve(null); return; }
            try {
              const head = await file.slice(0, 4096).text();
              if (/\.webarchive$/i.test(file.name) || head.startsWith('bplist') || head.includes('WebMainResource') || /"format"\s*:\s*"pscube-viewer"/.test(head) || (/"rack"\s*:/.test(head) && /"graph"\s*:/.test(head))) {
                resolve(await (await pscubeModule()).readPscubeFiles([file]));
              } else resolve(finish(await parse(file.stream()), file.name));
            }
            catch (error) { reject(error); }
          };
          input.oncancel = () => resolve(null);
          input.click();
        });
      },
      // 同じサイトの中のファイルだけ（手元での確認用）。外部のURLは読まない。
      async fromUrl(url) {
        if (!url || /^[a-z]+:/i.test(url) || url.startsWith('//')) return null;
        const response = await fetch(url);
        if (!response.ok) return null;
        return finish(await parse(response.body), url);
      },
      // Googleのスクリプト（…/exec）から、Googleドライブの最新を読む。
      // それ以外のURLは読まない。記録はこの端末にだけ届く。
      // ファイルの書き出し時刻が [known]（表示中の内容の時刻）と同じなら、先頭の
      // 1行だけで読むのをやめて null を返す。開くたびに同じ中身を丸ごと読み直すと、
      // 通信と計算で電池を使うため。
      async fromRemote(url, known) {
        if (await pscubeActive()) return (await pscubeBridge()).fromRemote(url, known);
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url || '')) {
          throw new Error('GoogleのスクリプトのURL（https://script.google.com/macros/s/…/exec）を入れてください。');
        }
        const abort = new AbortController();
        let timer = 0;
        const wait = () => {
          clearTimeout(timer);
          timer = setTimeout(() => abort.abort(), REMOTE_IDLE_MS);
        };
        // 画面を離れている間（iPhoneでほかのアプリに切り替えた等）は待ち時間を数えない。
        // iPhoneは裏に回ったページの通信を止めるので、戻った瞬間に打ち切らないようにする。
        const page = typeof document === 'undefined' ? null : document;
        const onVisibility = () => {
          if (page.visibilityState === 'hidden') clearTimeout(timer);
          else wait();
        };
        if (page) page.addEventListener('visibilitychange', onVisibility);
        wait();
        try {
          let response;
          for (let attempt = 0; ; attempt++) {
            let failure = null;
            try {
              response = await fetch(url, { cache: 'no-store', signal: abort.signal });
            } catch (error) {
              if (abort.signal.aborted) throw error;
              failure = error;
            }
            const status = failure ? 0 : response.status;
            const again = failure || (!response.ok && (status === 404 || status === 429 || status >= 500));
            if (!again || attempt >= REMOTE_RETRY_DELAYS_MS.length) {
              if (failure) throw failure;
              break;
            }
            await new Promise((resolve) => setTimeout(resolve, REMOTE_RETRY_DELAYS_MS[attempt]));
            wait();
          }
          if (!response.ok) throw new Error('Googleドライブから読めませんでした（' + response.status + '）。');
          if ((response.headers.get('content-type') || '').includes('text/html')) {
            throw new Error('スクリプトの公開設定を確認してください（アクセスできるユーザー：全員）。');
          }
          wait();
          // 届くたびに待ち時間を数え直す。
          const body = response.body.pipeThrough(new TransformStream({
            transform(chunk, controller) {
              wait();
              controller.enqueue(chunk);
            },
          }));
          const result = await parse(body, known || null);
          if (result.unchanged) return null;
          return finish(result, 'Googleドライブ（自動）');
        } catch (error) {
          if (abort.signal.aborted) {
            throw new Error('Googleドライブから' + REMOTE_IDLE_MS / 1000 + '秒間応答がなかったため、読み込みをやめました。');
          }
          throw error;
        } finally {
          clearTimeout(timer);
          if (page) page.removeEventListener('visibilitychange', onVisibility);
        }
      },
      getRemote() {
        try { return localStorage.getItem('database-viewer-remote'); } catch (_) { return null; }
      },
      setRemote(url) {
        try {
          if (url) localStorage.setItem('database-viewer-remote', url);
          else localStorage.removeItem('database-viewer-remote');
        } catch (_) {}
      },
      async save(text) {
        const pscube = JSON.parse(text).format === 'pscube-viewer';
        if (pscube) await (await pscubeBridge()).save(text);
        const db = await open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, 'readwrite');
          if (!pscube) tx.objectStore(STORE).put(text, 'data');
          tx.objectStore(STORE).put(pscube ? 'pscube' : 'meruhen', 'active_source');
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      },
      async load() {
        if (await pscubeActive()) return (await pscubeBridge()).load();
        const db = await open();
        const value = await new Promise((resolve, reject) => {
          const request = db.transaction(STORE).objectStore(STORE).get('data');
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return value;
      },
      async exportBackup() { return (await pscubeBridge()).exportBackup(); },
      async importGraph(text) { return (await pscubeBridge()).importGraph(text); },
      async setSuffixEvent(scope, day, enabled) {
        return (await pscubeBridge()).setSuffixEvent(scope, day, enabled);
      },
      async setPscubeType(scope, machine, type) {
        return (await pscubeBridge()).setPscubeType(scope, machine, type);
      },
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
